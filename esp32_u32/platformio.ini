; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio_local.ini
default_envs = bridge

; Közös beállítások
[base]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM4
monitor_port = COM4

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    knolleary/PubSubClient@^2.8
lib_extra_dirs = ../lib

; Közös OTA beállítások.
; Az első feltöltés (OTA kóddal) kábelen kell. A jelszó egyezzen a secrets.h OTA_PASS-szal.
; Ha a .local név nem oldódik fel, írd be az IP-címet az upload_port-ba.
[ota]
upload_protocol = espota
upload_port = 192.168.50.198 ;h0-bridge.local
;upload_flags = --auth=IDE_AZ_OTA_JELSZO
upload_flags = ${secrets.ota_auth}

; DEBUG build: soros konzol kiírások be (pio run -e bridge -t upload)
[env:bridge]
extends = base
build_flags =
    -DDEBUG_SERIAL=1
    -DCORE_DEBUG_LEVEL=1

; RELEASE build: nincs soros kiírás, a core logok is kikapcsolva
[env:bridge_release]
extends = base
build_flags =
    -DDEBUG_SERIAL=0
    -DCORE_DEBUG_LEVEL=0

; OTA feltöltés WiFi-n
; debug:   pio run -e bridge_ota -t upload
; release: pio run -e bridge_release_ota -t upload
[env:bridge_ota]
extends = env:bridge, ota

[env:bridge_release_ota]
extends = env:bridge_release, ota
